name: Deploy MCP Azure Board

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_azure_board/requirements.txt

      - name: Run Lint
        run: |
          pip install flake8
          flake8 mcp_azure_board --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build Docker image
        run: |
          docker build -t mcp-azure-board:latest -f mcp_azure_board/Dockerfile .

      - name: Push Docker image to Azure Container Registry
        env:
          REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          USERNAME: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}
        run: |
          echo $PASSWORD | docker login $REGISTRY -u $USERNAME --password-stdin
          docker tag mcp-azure-board:latest $REGISTRY/mcp-azure-board:latest
          docker push $REGISTRY/mcp-azure-board:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/mcp-azure-board:latest

name: Deploy MCP Azure Board Server to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_azure_board/requirements.txt

      - name: Archive application
        run: |
          cd mcp_azure_board
          zip -r ../mcp_azure_board.zip .

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: mcp_azure_board.zip

      - name: Azure Login (for setting app settings)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables (App Settings)
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          mask-inputs: false
          app-settings-json: |
            {
              "BLOB_STORAGE_CONNECTION_STRING": "${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}",
              "AZURE_DEVOPS_PAT": "${{ secrets.AZURE_DEVOPS_PAT }}",
              "AZURE_DEVOPS_ORG": "${{ secrets.AZURE_DEVOPS_ORG }}",
              "AZURE_DEVOPS_PROJECT": "${{ secrets.AZURE_DEVOPS_PROJECT }}",
              "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
              "WORKFLOWS_YAML_PATH": "workflows.yaml"
            }

      # Exemplo de como adicionar mais variáveis de ambiente necessárias
      # Adicione outras variáveis sensíveis como secrets no repositório e referencie aqui

    env:
      # Variáveis de ambiente globais para o job (opcional)
      PYTHONUNBUFFERED: 1

criacao_epicos_azure_devops:
  description: "Criação de épicos no Azure DevOps a partir de transcrição de reunião."
  steps:
    - name: "Gerar relatório de épicos"
      agent: "epic_generator"
      prompt_path: "azure_mcp/prompts/criacao_epicos.md"
      requires_approval: true
      status_update: "pending_approval"
    - name: "Criar épicos no Azure Board"
      agent: "azure_board_committer"
      prompt_path: "azure_mcp/prompts/criacao_epicos.md"
      status_update: "completed"

criacao_tarefas_azure_devops:
  description: "Criação de tarefas ligadas a uma feature no Azure DevOps a partir de relatório."
  steps:
    - name: "Gerar relatório de tarefas"
      agent: "task_generator"
      prompt_path: "azure_mcp/prompts/criacao_tarefas_azure_devops.md"
      requires_approval: true
      status_update: "pending_approval"
    - name: "Criar tarefas no Azure Board"
      agent: "azure_board_committer"
      prompt_path: "azure_mcp/prompts/criacao_tarefas_azure_devops.md"
      status_update: "completed"

revisor_tarefas:
  description: "Revisão de tarefas do Azure DevOps, atualizando discussões e status."
  steps:
    - name: "Gerar relatório de revisão de tarefa"
      agent: "revisor_board"
      prompt_path: "azure_mcp/prompts/melhoria_de_tarefas.md"
      requires_approval: true
      status_update: "pending_approval"
    - name: "Atualizar discussão da tarefa"
      agent: "task_discussion_updater"
      prompt_path: "azure_mcp/prompts/melhoria_de_tarefas.md"
      status_update: "completed"

criacao_features_azure_devops:
  description: "Criação de features no Azure DevOps a partir de épico e relatório."
  steps:
    - name: "Gerar relatório de features"
      agent: "feature_generator"
      prompt_path: "azure_mcp/prompts/criacao_features_azure_devops.md"
      requires_approval: true
      status_update: "pending_approval"
    - name: "Criar features no Azure Board"
      agent: "azure_board_committer"
      prompt_path: "azure_mcp/prompts/criacao_features_azure_devops.md"
      status_update: "completed"

# workflows.yaml
# Apenas workflows de revisão e melhoria de código permanecem ativos.
# Todos os workflows/steps que utilizam AgenteProcessador ou AgenteRevisorCodigo foram removidos ou comentados.

workflows:
  revisao_codigo:
    description: Revisão de código genérica
    steps:
      - name: Revisar Código
        agent: agente_revisor
        status_update: processing
        params:
          tipo_analise: review
  melhoria_codigo:
    description: Melhoria de código genérica
    steps:
      - name: Melhorar Código
        agent: agente_revisor
        status_update: processing
        params:
          tipo_analise: improve
# Os workflows abaixo foram removidos/comentados por dependerem de agentes excluídos:

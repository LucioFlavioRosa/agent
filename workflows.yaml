relatorio_cleancode:
  description: "Análise de código limpo e boas práticas."
  steps:
    - name: "Gerar relatório de Clean Code"
      agent: "agente_revisor"
      prompt: "relatorio_cleancode"
      requires_approval: true
      status_update: "pending_approval"
    - name: "Aplicar melhorias sugeridas"
      agent: "agente_processador"
      prompt: "aplicacao_de_mudancas"
      status_update: "processing"
relatorio_owasp:
  description: "Análise de segurança baseada nas recomendações OWASP."
  steps:
    - name: "Gerar relatório OWASP"
      agent: "agente_revisor"

analise_arquitetura:
  extensions: [".py", ".js", ".java", ".cs", ".cpp", ".c", ".h", ".hpp", ".php", ".rb", ".go", ".rs", ".kt", ".swift", ".ts", ".jsx", ".tsx", ".vue", ".html", ".css", ".scss", ".less", ".sql", ".yaml", ".yml", ".json", ".xml", ".md", ".txt", ".sh", ".bat", ".ps1", ".dockerfile", ".tf", ".hcl"]
  steps:
    - agent_type: "revisor"
      params:
        tipo_analise: "analise_arquitetura"
      status_update: "Analisando arquitetura do código..."
      requires_approval: true

comparacao_funcionalidades:
  extensions: [".py", ".js", ".java", ".cs", ".cpp", ".c", ".h", ".hpp", ".php", ".rb", ".go", ".rs", ".kt", ".swift", ".ts", ".jsx", ".tsx", ".vue", ".html", ".css", ".scss", ".less", ".sql", ".yaml", ".yml", ".json", ".xml", ".md", ".txt", ".sh", ".bat", ".ps1", ".dockerfile", ".tf", ".hcl"]
  steps:
    - agent_type: "comparador"
      params:
        tipo_analise: "comparacao_funcionalidades"
      status_update: "Comparando funcionalidades entre código original e modernizado..."
      requires_approval: true

implementacao:
  extensions: [".py", ".js", ".java", ".cs", ".cpp", ".c", ".h", ".hpp", ".php", ".rb", ".go", ".rs", ".kt", ".swift", ".ts", ".jsx", ".tsx", ".vue", ".html", ".css", ".scss", ".less", ".sql", ".yaml", ".yml", ".json", ".xml", ".md", ".txt", ".sh", ".bat", ".ps1", ".dockerfile", ".tf", ".hcl"]
  steps:
    - agent_type: "revisor"
      params:
        tipo_analise: "implementacao"
      status_update: "Analisando código para implementação..."
      requires_approval: true
    - agent_type: "processador"
      params:
        tipo_analise: "implementacao"
      status_update: "Processando implementação..."
      requires_approval: false
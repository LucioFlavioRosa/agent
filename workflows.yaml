criacao_epicos_azure_devops:
  description: "Gerar épicos de metodologia kanban e criar no Azure DevOps."
  extensions: [".md", ".yaml", ".txt"]
  workflow_mode: "epic_task_creation"
  steps:
    - status_update: "gerando_relatorio_epicos"
      model_name: "claude-sonnet-4-5"
      agent_type: "processador"
      params:
        tipo_analise: "criacao_epicos"
      requires_approval: true
    - status_update: "criando_epicos_no_azure_boards"
      model_name: "gpt-4.1"
      agent_type: "epic_azure_writer"
      params:
        tipo_analise: "criacao_epicos_azure"

relatorio_performance_eficiencia:
  description: "Analisar o código-fonte fornecido, independentemente da linguagem, para identificar gargalos de performance e ineficiências computacionais"
  extensions: [".py", ".cs", ".css",".js", ".aspx", ".csproj", ".config", ".aspx.cs", ".Global.asax", ".Web.config", ".designer.cs", ".razor", ".cshtml", "xlsx", ".md", ".yaml", ".txt", ".html"]
  steps:
    - status_update: "analisando o repositório"
      model_name: "claude-sonnet-4-5"
      agent_type: "revisor"
      params:
        repository_type: "${repository_type}"
        repo_name: "${repo_name}"
        branch_name: "${branch_name}"
        analysis_type: "relatorio_performance_eficiencia"
        projeto: "${projeto}"
        analysis_name: "${analysis_name}"
        gerar_relatorio_apenas: ${gerar_relatorio_apenas}
        retornar_lista_arquivos: ${retornar_lista_arquivos}
        usuario_executor: "${usuario_executor}"
      requires_approval: true
    - status_update: "aplicando_as_mudancas_apontadas"
      model_name: "gpt-4.1"
      agent_type: "revisor"
      params:
        repository_type: "${repository_type}"
        repo_name: "${repo_name}"
        branch_name: "${branch_name}"
        analysis_type: "aplicacao_de_mudancas"
        projeto: "${projeto}"
        analysis_name: "${analysis_name}"
        gerar_relatorio_apenas: ${gerar_relatorio_apenas}
        retornar_lista_arquivos: ${retornar_lista_arquivos}
        usuario_executor: "${usuario_executor}"

